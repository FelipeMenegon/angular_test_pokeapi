<div class="modal-align">
    <div class="modal">
        <div class="pokeball-center"></div>

        <div class="align">
            @if (loadingService.isLoading() === false) {

            <app-search (pokemonSearched)="onPokemonSearched($event)" />
            }
            @if(pokemonName){
            <app-loading />
            <app-card [pokeName]="pokemonName" />
            }
        </div>
    </div>
</div>
